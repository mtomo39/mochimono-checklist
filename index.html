<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- このアプリ自身のファイル以外、一切の外部通信を許可しない設定
     (万一コードに問題が混入しても、外部への勝手なデータ送信をブラウザ側でブロックする) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>持ち物チェックリスト</title>

<!-- PWA / iOS ホーム画面対応 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="持ち物リスト">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===== チェックリスト一覧画面(Reminders の「リスト」画面) ===== -->
  <section id="view-lists" class="view">
    <header class="large-title-bar">
      <h1>マイリスト</h1>
      <span id="app-version" class="version-tag"></span>
    </header>

    <div id="lists-container" class="card-group"></div>

    <button id="btn-new-list" class="add-row">
      <span class="add-row-icon">＋</span>新しいリスト
    </button>

    <button id="btn-new-from-template" class="add-row">
      <span class="add-row-icon">📄</span>テンプレートから作る
    </button>

    <div id="template-picker" class="card-group hidden"></div>

    <div class="io-row">
      <button id="btn-export" class="btn-ghost">書き出し (JSON)</button>
      <label class="btn-ghost file-label">
        読み込み
        <input type="file" id="file-import" accept="application/json" hidden>
      </label>
    </div>

    <button id="btn-show-tutorial" class="btn-ghost btn-ghost-full">📖 使い方ガイド(サンプル)を見る</button>
  </section>

  <!-- ===== チェックリスト詳細画面 ===== -->
  <section id="view-detail" class="view hidden">
    <div class="nav-bar">
      <button id="btn-back" class="nav-back">‹ リスト</button>
      <div class="nav-bar-right">
        <button id="btn-toggle-mode" class="nav-action"></button>
        <button id="btn-save-template" class="nav-action">📄 テンプレートとして保存</button>
      </div>
    </div>

    <header class="large-title-bar detail-title-bar">
      <h1 id="detail-title" contenteditable="true" spellcheck="false" data-placeholder="新しいリスト"></h1>
    </header>

    <div class="progress-wrap">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <span id="progress-label">0/0</span>
    </div>

    <div class="segmented" role="group" aria-label="表示切替">
      <button class="seg-btn active" data-filter="all">すべて</button>
      <button class="seg-btn" data-filter="unchecked">未チェック</button>
    </div>

    <div class="list-clear-row">
      <button id="btn-check-all-list" class="mini-btn">すべてチェック</button>
      <button id="btn-uncheck-all-list" class="mini-btn">すべて解除</button>
    </div>

    <div id="tree-root" class="card-group tree-root"></div>

    <button id="btn-add-root-item" class="add-row">
      <span class="add-row-icon">＋</span>新規項目
    </button>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
